name: "31-33"

on:
  workflow_dispatch:
  schedule:
    - cron: '5 0,6,12,18 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        target: ['akun-31', 'akun-32', 'akun-33']

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Google Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y wget google-chrome-stable

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib selenium requests selenium-stealth undetected-chromedriver

    - name: Download & Extract Files from Google Drive
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FILE_ID }}
      run: python download_drive.py

    - name: Run All Subfolder Bots In Parallel
      run: |
        python -c "
        import os, subprocess, time

        target = '${{ matrix.target }}'
        processes = []

        # Mencari folder target secara fleksibel di mana saja
        for root, dirs, files in os.walk('.'):
            if target in root and 'seofast_zhp.py' in files:
                print(f'==> Launching Bot Subfolder: {root}')
                
                # Auto-restart loop jika bot crash / exit internal
                cmd = f'until python3 seofast_zhp.py; do echo \"[!] Bot crash, restart dalam 5 detik...\"; sleep 5; done'
                p = subprocess.Popen(cmd, shell=True, executable='/bin/bash', cwd=root)
                processes.append(p)

        if processes:
            for p in processes:
                p.wait()
        else:
            print(f'Folder {target} tidak ditemukan!')
        "
